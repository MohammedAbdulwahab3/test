services:
  # PostgreSQL Database (Free tier for 90 days)
  - type: pserv
    name: flutter-backend-db
    plan: free
    region: oregon
    databases:
      - name: flutter_db
        user: flutter_user
    ipAllowList: []

  # Web Service - Go Backend
  - type: web
    name: flutter-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: AUTO_MIGRATE
        value: true
      - key: DB_DRIVER
        value: postgres
      - key: DB_DSN
        fromDatabase:
          name: flutter-backend-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
